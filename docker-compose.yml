services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma db push && npm start"
    environment:
      DATABASE_URL: file:/app/data/portfolio.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      NODE_ENV: production
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sendiko-portfolio}
      MINIO_PUBLIC_URL: /api/storage/file
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - database:/app/data
    restart: unless-stopped

volumes:
  database:
